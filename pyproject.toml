[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hushai"
description = "Zen AI CLI — one sentence at a time"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The hush.ai Authors" }]
keywords = ["cli", "llm", "openai", "zen", "chat"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = [
  "openai>=1.0.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/peace-lab-global/hush.ai"
Documentation = "https://github.com/peace-lab-global/hush.ai/blob/main/docs/README.md"
Repository = "https://github.com/peace-lab-global/hush.ai"
Issues = "https://github.com/peace-lab-global/hush.ai/issues"
Changelog = "https://github.com/peace-lab-global/hush.ai/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-asyncio>=0.21.0",
  "ruff>=0.4.0",
  "mypy>=1.8",
  "pre-commit>=3.0",
  "pip-audit>=2.6",
  "build>=1.0",
  "bandit>=1.7",
]
meditation = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  "greenlet>=3.0.0",
  "eval_type_backport>=0.3.0",
  "alembic>=1.13.0",
  "chromadb>=0.4.22",
  "python-jose[cryptography]>=3.3.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "jinja2>=3.0.0",
  "python-multipart>=0.0.9",
  "slowapi>=0.1.9",
  "pandas>=2.0.0",
  "openpyxl>=3.0.0",
]

[project.scripts]
hush = "hushai.cli:main"
hush-meditation = "hushai.meditation.app:run"
hush-init-knowledge = "hushai.meditation.commands.init_knowledge:main"

[tool.setuptools]
packages = ["hushai"]

[tool.setuptools.dynamic]
version = { attr = "hushai.__version__" }

[tool.setuptools.package-data]
hushai = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
  "asyncio: mark a test as an asyncio test",
]

[tool.coverage.run]
branch = true
source = ["hushai"]
omit = ["hushai/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["hushai", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "UP006", "UP035", "UP037", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["hushai"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
strict_optional = true
packages = ["hushai"]
exclude = [".venv", "build", "dist"]

[[tool.mypy.overrides]]
module = "openai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "click.*"
ignore_missing_imports = true
follow_imports = "skip"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "socksio>=1.0.0",
]
