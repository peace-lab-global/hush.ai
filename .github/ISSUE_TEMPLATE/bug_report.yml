name: Bug report
description: Report unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Commands, environment variables (redact secrets), OS/Python version.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: e.g. output of `hush --version` or git commit SHA
    validations:
      required: false
