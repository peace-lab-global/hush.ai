name: Feature request
description: Suggest an idea for hush.ai
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What problem does this solve? Who benefits?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Optional sketch of API/UX or alternatives considered.
    validations:
      required: false
